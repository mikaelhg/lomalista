[package]
name = "lomalista"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "set-header", "limit", "trace"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
http-body-util = "0.1.5"
